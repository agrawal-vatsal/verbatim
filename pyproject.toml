[project]
name = "verbatim"
version = "0.1.0"
description = "A project for understanding and discussing the financial reports"
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "langchain>=1.2.17",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.36.0",
    "pdfplumber>=0.11.9",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "typer>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.genai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# anyio's pytest plugin imports a renamed pytest internal; not our code
filterwarnings = ["ignore:.*CallSpec2.*:pytest.PytestRemovedIn10Warning"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# pyflakes + core pycodestyle errors, import sorting, bugbear
select = ["E4", "E7", "E9", "F", "I", "B"]
