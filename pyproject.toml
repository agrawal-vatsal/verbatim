[project]
name = "verbatim"
version = "0.1.0"
description = "A project for understanding and discussing the financial reports"
requires-python = ">=3.13"
dependencies = [
    "google-genai>=3.3.0",
    "httpx>=0.28.1",
    "langchain>=1.5.0",
    "langchain-openai>=1.8.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.22",
    "openai>=3.51.0",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "typer>=0.29.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict = true

[[tool.mypy.overrides]]
module = "pgvector.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.genai"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# anyio's pytest plugin imports a renamed pytest internal; not our code
filterwarnings = ["ignore:.*CallSpec2.*:pytest.PytestRemovedIn10Warning"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# pyflakes + core pycodestyle errors, import sorting, bugbear
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
source = ["verbatim", "scripts", "evals"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
